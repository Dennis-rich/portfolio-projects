
services:
  # 📨 Kafka + Zookeeper (поток событий)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    mem_limit: 512m
    networks: [data-net]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    mem_limit: 1G
    networks: [data-net]

  # ⚡ Spark (трансформации)
  spark-master:
    image: apache/spark:3.4.1
    container_name: spark-master
    working_dir: /opt/spark
    command: ["bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports: ["8080:8080", "7077:7077"]
    environment:
      - SPARK_MASTER_HOST=spark-master
    mem_limit: 1.5G
    networks: [data-net]

  spark-worker:
    image: apache/spark:3.4.1
    container_name: spark-worker
    working_dir: /opt/spark
    command: ["bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1g
    depends_on: [spark-master]
    mem_limit: 1.2G
    networks: [data-net]
    
  # 🗄️ PostgreSQL (пользователи + витрины)
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: project_db
    mem_limit: 1G
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data-net]

  # 💾 MinIO (S3-эмулятор для сырых данных и фичей)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    mem_limit: 512m
    volumes: [minio-data:/data]
    networks: [data-net]

  # 🧪 JupyterLab (где будем писать код)
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.4.1
    container_name: jupyter
    ports: ["8888:8888"]
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    volumes:
      - ./:/home/jovyan/work
    mem_limit: 1.5G
    networks: [data-net]
    depends_on: [kafka, spark-master, postgres, minio]

  api:
    image: python:3.11-slim
    container_name: purchase-api
    ports: ["8000:8000"]
    volumes:
      - ./:/app
    working_dir: /app/src/mle/api
    command: >
      bash -c "
        pip install --no-cache-dir fastapi uvicorn catboost mlflow pandas pydantic &&
        python -m uvicorn main:app --host 0.0.0.0 --port 8000
      "
    mem_limit: 512m
    networks: [data-net]
    depends_on: [jupyter]
    restart: unless-stopped

networks:
  data-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
